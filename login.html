<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <div class="logo">
                <img src="846imguf_LogoGLBajaj.jpg" alt="Logo" width="50" height="50">
                
            </div>

            <div class="website-name">
                BOOK STORE APP
            </div>

        </div>


        <!-- NAVIGATION -->

                            <input type="submit" value="Submit">

                    </form>

                </div>

            </div>

        </div>
